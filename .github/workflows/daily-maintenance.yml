name: Daily Maintenance

on:
  schedule:
    # Run once per day at 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch: # allow manual trigger too

jobs:
  maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update activity log
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%d %H:%M:%S UTC" >> .github/activity.log
          echo "Daily maintenance run" >> .github/activity.log
          # Keep file from growing forever
          tail -n 100 .github/activity.log > .github/activity.log.tmp && mv .github/activity.log.tmp .github/activity.log

      - name: Commit if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/activity.log
          git diff --cached --quiet || git commit -m "chore(ci): daily maintenance [skip ci]"

      - name: Push changes
        run: |
          git push origin HEAD:${{ github.ref_name }} || echo "No changes or push skipped"
